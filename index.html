    }
    .chrome-spacer { width: 56px; }

    .screen {
      flex: 1;
      overflow-y: auto;
      padding: 18px 22px 8px;
      font-size: 14px;
      line-height: 1.55;
    }

    .line { white-space: pre-wrap; word-break: break-word; }

    .muted    { color: var(--gray); }
    .green    { color: var(--green); }
    .blue     { color: var(--blue); }
    .yellow   { color: var(--yellow); }
    .orange   { color: var(--orange); }
    .red      { color: var(--red); }
    .pink     { color: var(--pink); }
    .aqua     { color: var(--aqua); }
    .dim      { color: var(--fg-dim); }
    .bold     { font-weight: 700; }

    .banner-info { color: var(--fg-dim); }
    .banner-key  { color: var(--yellow); font-weight: 500; }

    .prompt-line, .input-line {

      align-items: baseline;

    .user-host { color: var(--green); font-weight: 500; }
    .colon { color: var(--fg); }
    .path { color: var(--blue); font-weight: 500; }
    .dollar { color: var(--fg); margin-right: 6px; }

  </style>

  const SKILLS = [
    { cat: 'Languages',   items: ['Python', 'JavaScript', 'TypeScript', 'C', 'C++', 'SQL'] },
    { cat: 'Frameworks',  items: ['Frappe (v15, v16)', 'Vue 3', 'Flask', 'TensorFlow', 'Scikit-learn'] },
    { cat: 'Databases',   items: ['MySQL', 'MariaDB', 'PostgreSQL', 'MongoDB', 'SQL Server', 'Firebase'] },
    { cat: 'Tools',       items: ['Git', 'GitHub', 'Linux / bash', 'VS Code', 'Jupyter', 'PowerBI', 'Advanced Excel'] },
    { cat: 'Libraries',   items: ['pandas', 'NumPy', 'Matplotlib', 'Seaborn', 'sciPy'] },
  ];

  const CERTS = [
    'Anudip Foundation — Data Visualization',
    'Anudip Foundation — SQL (Advanced Querying)',
    'Anudip Foundation — Python for Data Analytics',
  ];

  // ════════════════════════════════════════════════════════════════════════
  //  DOM HELPERS
  // ════════════════════════════════════════════════════════════════════════
  const screen = document.getElementById('screen');

  function el(tag, opts) {
    const e = document.createElement(tag);
    if (opts?.class) e.className = opts.class;
    if (opts?.html != null) e.innerHTML = opts.html;
    if (opts?.text != null) e.textContent = opts.text;
    return e;
  }

  function print(html, cls) {
    const d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.innerHTML = html;
    screen.appendChild(d);
    scrollToBottom();
    return d;
  }

  function printRaw(text, cls) {
    const d = document.createElement('div');
    d.className = 'line' + (cls ? ' ' + cls : '');
    d.textContent = text;
    screen.appendChild(d);
    scrollToBottom();
    return d;
  }

  function blank() {
    const d = document.createElement('div');
    d.className = 'line';
    d.innerHTML = '&nbsp;';
    screen.appendChild(d);
  }

  function scrollToBottom() {
    screen.scrollTop = screen.scrollHeight;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function promptHtml() {
    return `<span class="user-host">${STATE.user}@${STATE.host}</span><span class="colon">:</span><span class="path">${STATE.cwd}</span><span class="dollar">$</span>`;
  }

  function printPromptEcho(cmdText) {
    const d = document.createElement('div');
    d.className = 'line prompt-line';
    d.innerHTML = `${promptHtml()} ${esc(cmdText)}`;
    screen.appendChild(d);
    scrollToBottom();
  }

  // ════════════════════════════════════════════════════════════════════════
  //  BOOT SEQUENCE
  // ════════════════════════════════════════════════════════════════════════
  const BOOT_LINES = [
    'Booting Portfolio v1.0 ...',
    'Mounted /home/navneet',
    'Started fingerd.service',
    'Reached target Multi-User System',
    'Welcome.',
  ];

  async function boot() {
    STATE.typingLocked = true;
    for (const line of BOOT_LINES) {
      print(`<span class="green">[  OK  ]</span> <span class="dim">${esc(line)}</span>`);
      await sleep(110);
    }
    blank();
    renderBanner();
    blank();
    print(`<span class="dim">Type</span> <span class="yellow">help</span> <span class="dim">to get started, or</span> <span class="yellow">ls</span> <span class="dim">to look around.</span>`);
    blank();
    STATE.typingLocked = false;
    appendInputLine();
  }

  function renderBanner() {
    // Side-by-side ASCII cat + info block
    const rows = Math.max(BANNER_CAT.length, BANNER_INFO.length);
    const out = [];
    for (let i = 0; i < rows; i++) {
      const cat = BANNER_CAT[i] || '                   ';
      const info = BANNER_INFO[i];
      let right = '';
      if (info) {
        if (info.v) {
          right = `<span class="banner-key">${esc(info.k)}:</span> <span class="banner-info">${esc(info.v)}</span>`;
        } else {
          right = `<span class="ascii bold">${esc(info.k)}</span>`;
        }
      }
      print(`<span class="ascii">${esc(cat)}</span>  ${right}`);
    }
  }

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  // ════════════════════════════════════════════════════════════════════════
  //  INPUT LINE (real prompt)
  // ════════════════════════════════════════════════════════════════════════
  let currentInputEl = null;

  function appendInputLine() {
    const line = document.createElement('div');
    line.className = 'line input-line';
    line.innerHTML = `${promptHtml()} <input type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />`;
    screen.appendChild(line);
    const input = line.querySelector('input');
    currentInputEl = input;
    input.focus();
    input.addEventListener('keydown', onKey);
    scrollToBottom();
  }

  function freezeInputLine(value) {
    if (!currentInputEl) return;
    const parent = currentInputEl.parentElement;
    parent.innerHTML = `${promptHtml()} ${esc(value)}`;
    currentInputEl = null;
  }

  function onKey(e) {
    if (STATE.typingLocked) { e.preventDefault(); return; }

    if (e.key === 'Enter') {
      e.preventDefault();
      const v = currentInputEl.value;
      freezeInputLine(v);
      if (v.trim().length > 0) {
        STATE.history.push(v);
        STATE.historyIdx = STATE.history.length;
      }
      executeCommand(v);
      appendInputLine();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (STATE.history.length === 0) return;
      STATE.historyIdx = Math.max(0, STATE.historyIdx - 1);
      currentInputEl.value = STATE.history[STATE.historyIdx] ?? '';
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (STATE.history.length === 0) return;
      STATE.historyIdx = Math.min(STATE.history.length, STATE.historyIdx + 1);
      currentInputEl.value = STATE.history[STATE.historyIdx] ?? '';
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const partial = currentInputEl.value;
      const matches = Object.keys(COMMANDS).filter((c) => c.startsWith(partial));
      if (matches.length === 1) currentInputEl.value = matches[0] + ' ';
      else if (matches.length > 1) {
        print(`<span class="dim">${matches.join('  ')}</span>`);
      }
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault();
      doClear();
    } else if (e.key === 'c' && e.ctrlKey) {
      e.preventDefault();
      const v = currentInputEl.value;
      freezeInputLine(v + '^C');
      appendInputLine();
    }
  }

  // Keep focus in the input even if user clicks elsewhere in the terminal
  screen.addEventListener('click', () => { if (currentInputEl) currentInputEl.focus(); });
  document.addEventListener('keydown', (e) => {
    if (currentInputEl && document.activeElement !== currentInputEl && !e.ctrlKey && !e.metaKey) {
      currentInputEl.focus();
    }
  });

  // ════════════════════════════════════════════════════════════════════════
  //  COMMANDS
  // ════════════════════════════════════════════════════════════════════════
  const COMMANDS = {
    help:       doHelp,
    whoami:     doWhoami,
    about:      doAbout,
    ls:         doLs,
    cd:         doCd,
    pwd:        doPwd,
    cat:        doCat,
    projects:   doProjects,
    skills:     doSkills,
    experience: doExperience,
    education:  doEducation,
    contact:    doContact,
    resume:     doResume,
    certs:      doCerts,
    clear:      doClear,
    history:    doHistory,
    echo:       doEcho,
    date:       doDate,
    uname:      doUname,
    theme:      doTheme,
    sudo:       doSudo,
    vim:        doVim,
    emacs:      doEmacs,
    nano:       doNano,
    cowsay:     doCowsay,
    exit:       doExit,
    banner:     () => { renderBanner(); blank(); },
  };

  function executeCommand(raw) {
    const input = raw.trim();
    if (!input) return;
    const tokens = input.split(/\s+/);
    const cmd = tokens[0];
    const args = tokens.slice(1);
    if (COMMANDS[cmd]) {
      try { COMMANDS[cmd](args); }
      catch (err) { print(`<span class="red">internal error:</span> ${esc(err.message)}`); }
    } else {
      print(`<span class="red">bash:</span> ${esc(cmd)}: command not found`);
      print(`<span class="dim">Try</span> <span class="yellow">help</span> <span class="dim">for a list of commands.</span>`);
    }
  }

  function doHelp() {
    const groups = [
      ['Identity',   [['whoami', 'one-line identity'], ['about', 'the longer story'], ['contact', 'how to reach me']]],
      ['Work',       [['experience', 'work history'], ['projects', 'projects (flags: --frappe, --past, --all)'], ['skills', 'tech stack'], ['education', 'degree info'], ['certs', 'certifications']]],
      ['Files',      [['ls', 'list files'], ['cd <dir>', 'change directory (cosmetic)'], ['pwd', 'print working directory'], ['cat <file>', 'print a file'], ['resume', 'open resume / print inline']]],
      ['Terminal',   [['clear', 'clear screen'], ['history', 'command history'], ['theme', 'cycle gruvbox / catppuccin / classic'], ['date', 'current date'], ['uname', 'system info'], ['echo <text>', 'echo input']]],
      ['Easter eggs',[['sudo', 'try it'], ['vim', 'editor war'], ['emacs', 'editor war (other side)'], ['nano', 'editor truce'], ['cowsay <text>', 'a cow says things']]],
    ];
    print(`<span class="orange bold">Available commands</span>`);
    print(`<span class="hr">─────────────────────────────────────────────────────</span>`);
    for (const [title, cmds] of groups) {
      print(`<span class="yellow">${esc(title)}</span>`);
      for (const [name, desc] of cmds) {
        print(`  <span class="green">${esc(name).padEnd(18, ' ')}</span> <span class="dim">${esc(desc)}</span>`);
      }
      blank();
    }
    print(`<span class="dim">Hint: Up/Down arrows cycle history. Tab completes commands.</span>`);
    blank();
  }

  function doWhoami() {
    print(`<span class="green bold">Navneet Patteri</span> <span class="dim">— Software Engineer @ DhwaniRIS · ~10 months · full-stack via Frappe</span>`);
    blank();
  }

  function doAbout() {
    print(`<span class="orange bold">about.md</span>`);
    print(`<span class="hr">────────</span>`);
    for (const l of ABOUT_TEXT) {
      if (l === '') blank();
      else print(`<span class="cream">${esc(l)}</span>`);
    }
    blank();
  }

  function doLs() {
    const dirs = ['experience/', 'projects/', 'skills/'];
    const files = ['about.md', 'education.md', 'contact.txt', 'certifications.txt', 'resume.pdf'];
    const items = [
      ...dirs.map((d) => `<span class="blue">${esc(d)}</span>`),
      ...files.map((f) => `<span class="cream">${esc(f)}</span>`),
    ];
    print(items.join('   '));
    blank();
  }

  function doCd(args) {
    const target = (args[0] || '~').replace(/\/$/, '');
    const valid = ['~', '/', '.', '..', 'experience', 'projects', 'skills'];
    if (target === '~' || target === '/' || target === '.') {
      STATE.cwd = '~';
    } else if (target === '..') {
      STATE.cwd = '~';
    } else if (valid.includes(target)) {
      STATE.cwd = `~/${target}`;
    } else {
      print(`<span class="red">cd:</span> ${esc(target)}: No such file or directory`);
    }
    blank();
  }

  function doPwd() {
    const real = STATE.cwd === '~' ? '/home/navneet' : `/home/navneet/${STATE.cwd.replace(/^~\//, '')}`;
    print(`<span class="cream">${esc(real)}</span>`);
    blank();
  }

  function doCat(args) {
    const file = args[0];
    if (!file) { print(`<span class="red">cat:</span> missing operand`); blank(); return; }
    const f = file.replace(/\/$/, '');
    if (f === 'about.md' || f === 'about') return doAbout();
    if (f === 'education.md' || f === 'education') return doEducation();
    if (f === 'contact.txt' || f === 'contact') return doContact();
    if (f === 'certifications.txt' || f === 'certifications') return doCerts();
    if (f === 'resume.pdf' || f === 'resume') {
      print(`<span class="yellow">resume.pdf</span> <span class="dim">is binary. Try</span> <span class="yellow">resume</span> <span class="dim">to print the SDE resume inline, or open</span> <a href="./resume.html" target="_blank">resume.html</a> <span class="dim">for the printable version.</span>`);
      blank(); return;
    }
    print(`<span class="red">cat:</span> ${esc(file)}: No such file or directory`);
    blank();
  }

  function doProjects(args) {
    const flags = new Set(args.filter((a) => a.startsWith('--')).map((a) => a.slice(2)));
    let list;
    if (flags.has('frappe')) list = PROJECTS_FRAPPE;
    else if (flags.has('past')) list = PROJECTS_PAST;
    else list = [...PROJECTS_FRAPPE, ...PROJECTS_PAST];

    print(`<span class="orange bold">Projects</span> <span class="dim">${esc('(' + list.length + ')')}</span>`);
    print(`<span class="hr">─────────────────────────────────────────────────────</span>`);
    for (const p of list) {
      const tag = p.tag === 'frappe'
        ? `<span class="badge frappe">frappe</span>`
        : `<span class="badge past">past</span>`;
      print(`${tag} <span class="proj-name">${esc(p.name)}</span> <span class="dim">·</span> <span class="proj-stack">${esc(p.stack)}</span>`);
      print(`  <span class="cream">${esc(p.desc)}</span>`);
      print(`  <span class="proj-role">${esc(p.role)}</span>`);
      blank();
    }
    if (!flags.has('frappe') && !flags.has('past')) {
      print(`<span class="dim">Flags:</span> <span class="yellow">projects --frappe</span> <span class="dim">·</span> <span class="yellow">projects --past</span>`);
      blank();
    }
  }

  function doSkills() {
    print(`<span class="orange bold">Skills</span>`);
    print(`<span class="hr">──────</span>`);
    for (const s of SKILLS) {
      const badges = s.items.map((i) => `<span class="badge">${esc(i)}</span>`).join(' ');
      print(`<span class="yellow">${esc(s.cat).padEnd(12, ' ')}</span> ${badges}`);
    }
    blank();
  }

  function doExperience() {
    print(`<span class="orange bold">Experience</span>`);
    print(`<span class="hr">──────────</span>`);
    for (const x of EXPERIENCE) {
      print(`<span class="aqua bold">${esc(x.role)}</span> <span class="dim">·</span> <span class="yellow">${esc(x.org)}</span>`);
      print(`<span class="dim">${esc(x.span)}</span>`);
      for (const b of x.bullets) {
        print(`  <span class="green">•</span> <span class="cream">${esc(b)}</span>`);
      }
      blank();
    }
  }

  function doEducation() {
    print(`<span class="orange bold">education.md</span>`);
    print(`<span class="hr">────────────</span>`);
    for (const l of EDUCATION_TEXT) {
      if (l === '') blank();
      else print(`<span class="cream">${esc(l)}</span>`);
    }
    blank();
  }

  function doContact() {
    print(`<span class="orange bold">contact.txt</span>`);
    print(`<span class="hr">───────────</span>`);
    for (const c of CONTACT) {
      const val = c.href
        ? `<a href="${esc(c.href)}" target="_blank">${esc(c.v)}</a>`
        : `<span class="cream">${esc(c.v)}</span>`;
      print(`<span class="yellow">${esc(c.k).padEnd(10, ' ')}</span> ${val}`);
    }
    blank();
  }

  function doCerts() {
    print(`<span class="orange bold">certifications.txt</span>`);
    print(`<span class="hr">──────────────────</span>`);
    for (const c of CERTS) {
      print(`<span class="green">✓</span> <span class="cream">${esc(c)}</span>`);
    }
    blank();
  }

  function doResume() {
    print(`<span class="orange bold">Resume — Software Engineer</span>`);
    print(`<span class="hr">──────────────────────────</span>`);
    doWhoami();
    print(`<span class="yellow">Summary</span>`);
    print(`<span class="cream">Full-stack engineer building Frappe-framework applications end-to-end at DhwaniRIS — Python doctype controllers, Vue 3 SPA frontends, MariaDB schema work. Prior data-analytics experience in Python, SQL, and Flask.</span>`);
    blank();
    doExperience();
    doSkills();
    doEducation();
    doCerts();
    print(`<span class="dim">For a printable / shareable version:</span>`);
    print(`  <span class="green">→</span> <a href="./resume.html" target="_blank">resume.html</a> <span class="dim">(open in browser, then File → Print → Save as PDF)</span>`);
    print(`  <span class="green">→</span> <a href="./resume.tex" target="_blank">resume.tex</a> <span class="dim">(LaTeX source — compile via Overleaf)</span>`);
    blank();
  }

  function doClear() {
    screen.innerHTML = '';
    appendInputLine();
  }

  function doHistory() {
    if (STATE.history.length === 0) {
      print(`<span class="dim">No history yet.</span>`);
      blank();
      return;
    }
    for (let i = 0; i < STATE.history.length; i++) {
      print(`  <span class="dim">${String(i + 1).padStart(3, ' ')}</span>  <span class="cream">${esc(STATE.history[i])}</span>`);
    }
    blank();
  }

  function doEcho(args) {
    print(`<span class="cream">${esc(args.join(' '))}</span>`);
    blank();
  }

  function doDate() {
    print(`<span class="cream">${esc(new Date().toString())}</span>`);
    blank();
  }

  function doUname() {
    print(`<span class="cream">Portfolio 1.0 navneet@portfolio #1 SMP x86_64 GNU/Linux</span>`);
    blank();
  }

  function doTheme() {
    STATE.themeIdx = (STATE.themeIdx + 1) % STATE.themes.length;
    const next = STATE.themes[STATE.themeIdx];
    document.body.classList.remove('theme-gruvbox', 'theme-catppuccin', 'theme-classic');
    document.body.classList.add('theme-' + next);
    print(`<span class="dim">theme →</span> <span class="yellow">${esc(next)}</span>`);
    blank();
  }

  function doSudo() {
    print(`<span class="red">[sudo]</span> password for navneet: <span class="dim">●●●●●●●●</span>`);
    print(`<span class="red">navneet is not in the sudoers file. This incident will be reported.</span>`);
    blank();
  }

  function doVim() {
    print(`<span class="cream">vim: editor war detected. Use</span> <span class="yellow">:q!</span> <span class="cream">to escape ...</span>`);
    print(`<span class="dim">(just kidding — :q works fine. but emacs users disagree about everything else.)</span>`);
    blank();
  }

  function doEmacs() {
    print(`<span class="cream">emacs: a fine operating system, lacking only a decent editor.</span>`);
    print(`<span class="dim">— attributed to many people, none of them happy about it.</span>`);
    blank();
  }

  function doNano() {
    print(`<span class="green">nano</span> <span class="cream">— the editor of peace. exit with</span> <span class="yellow">^X</span>.`);
    blank();
  }

  function doCowsay(args) {
    const msg = args.join(' ') || 'Moo.';
    const safe = msg.replace(/[^\x20-\x7e]/g, '');
    const line = '─'.repeat(Math.max(safe.length, 4) + 2);
    const cow = [
      ` ${line}`,
      `< ${safe} >`,
      ` ${line}`,
      `        \\   ^__^`,
      `         \\  (oo)\\_______`,
      `            (__)\\       )\\/\\`,
      `                ||----w |`,
      `                ||     ||`,
    ];
    for (const l of cow) print(`<span class="cream">${esc(l)}</span>`);
    blank();
  }

  function doExit() {
    print(`<span class="dim">There is no exit. You are home.</span>`);
    blank();
  }

  // ════════════════════════════════════════════════════════════════════════
  //  KICKOFF
  // ════════════════════════════════════════════════════════════════════════
  boot();
  </script>
